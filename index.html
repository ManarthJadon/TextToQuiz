<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Text to Quiz</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <h1>Text to Quiz</h1>

  <label>Upload a file (.pdf, .docx, .pptx, .txt, .md)
    <input type="file" id="file" accept=".pdf,.docx,.pptx,.txt,.md">
  </label>
  <label>Or paste text
    <textarea id="text"></textarea>
  </label>
  <label>Difficulty
    <select id="difficulty">
      <option>easy</option>
      <option selected>medium</option>
      <option>hard</option>
    </select>
  </label>
  <label>Number of questions
    <input type="number" id="count" value="5" min="1" max="20">
  </label>
  <button id="go">Make quiz</button>

  <div id="status"></div>
  <div id="score"></div>
  <div id="quiz"></div>

  <script src="/static/app.js"></script>
</body>
</html>
