<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Text to Quiz</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <h1>Text to Quiz</h1>

  <fieldset class="modes" aria-label="What to make">
    <label><input type="radio" name="mode" value="quiz" checked> Quiz</label>
    <label><input type="radio" name="mode" value="flashcards"> Flashcards</label>
    <label><input type="radio" name="mode" value="notes"> Notes</label>
  </fieldset>

  <label>Upload a file (.pdf, .docx, .pptx, .txt, .md)
    <input type="file" id="file" accept=".pdf,.docx,.pptx,.txt,.md">
  </label>
  <label>Or paste text
    <textarea id="text"></textarea>
  </label>
  <label id="difficulty-field">Difficulty
    <select id="difficulty">
      <option>easy</option>
      <option selected>medium</option>
      <option>hard</option>
    </select>
  </label>
  <label id="count-field"><span id="count-label">Number of questions</span>
    <input type="number" id="count" value="5" min="1" max="20">
  </label>
  <label id="detail-field" hidden>Detail
    <select id="detail">
      <option>short</option>
      <option selected>standard</option>
      <option>detailed</option>
    </select>
  </label>
  <button id="go">Make quiz</button>
  <p class="notice">AI-generated quizzes, flashcards and notes can contain mistakes, so double-check them. Your text is sent to Google Gemini, so please don't upload private or sensitive documents.</p>

  <div id="status"></div>
  <div id="score"></div>
  <div id="quiz"></div>
  <div id="cards"></div>
  <div id="notes"></div>

  <script src="/static/app.js"></script>
</body>
</html>
